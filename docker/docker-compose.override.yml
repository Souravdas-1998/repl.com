version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: deps
    command: pnpm --filter @workspace/api-server run dev
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
    volumes:
      - ../artifacts/api-server/src:/app/artifacts/api-server/src:ro
      - ../lib:/app/lib:ro
    ports:
      - "8080:8080"

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      target: deps
    command: pnpm --filter @workspace/clothing-store run dev --host 0.0.0.0
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: http://api:8080
    volumes:
      - ../artifacts/clothing-store/src:/app/artifacts/clothing-store/src:ro
      - ../lib:/app/lib:ro
    ports:
      - "3000:3000"
    depends_on:
      - api
