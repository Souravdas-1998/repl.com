name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}
  IMAGE_API: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository_owner }}/styleai-api
  IMAGE_WEB: ${{ secrets.DOCKER_REGISTRY || 'ghcr.io' }}/${{ github.repository_owner }}/styleai-web

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ${{ env.IMAGE_API }}:${{ steps.meta.outputs.version }},${{ env.IMAGE_API }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: ${{ env.IMAGE_WEB }}:${{ steps.meta.outputs.version }},${{ env.IMAGE_WEB }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          echo "Deploying tag: $IMAGE_TAG to staging"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> deploy.env
          echo "API_IMAGE=${IMAGE_API}:${IMAGE_TAG}" >> deploy.env
          echo "WEB_IMAGE=${IMAGE_WEB}:${IMAGE_TAG}" >> deploy.env

      - name: Run DB migrations (staging)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING }}
        run: |
          echo "Running migrations against staging DB..."

      - name: Smoke test staging
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          echo "Running smoke tests against $STAGING_URL"
          curl -f "${STAGING_URL}/api/healthz" || exit 1

  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: ${{ secrets.PROD_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          echo "Deploying tag: $IMAGE_TAG to production"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> deploy.env
          echo "API_IMAGE=${IMAGE_API}:${IMAGE_TAG}" >> deploy.env
          echo "WEB_IMAGE=${IMAGE_WEB}:${IMAGE_TAG}" >> deploy.env

      - name: Run DB migrations (production)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          echo "Running migrations against production DB..."

      - name: Smoke test production
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          echo "Running smoke tests against $PROD_URL"
          curl -f "${PROD_URL}/api/healthz" || exit 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## StyleAI ${{ github.ref_name }}

            Docker images:
            - API: `${{ env.IMAGE_API }}:${{ needs.build-and-push.outputs.image_tag }}`
            - Web: `${{ env.IMAGE_WEB }}:${{ needs.build-and-push.outputs.image_tag }}`
